name: Server Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xensemble
          POSTGRES_PASSWORD: xensemble
          POSTGRES_DB: xensemble
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xensemble -d xensemble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run migrations
        working-directory: server
        env:
          DATABASE_URL: postgres://xensemble:xensemble@127.0.0.1:5432/xensemble
        run: npm run db:migrate

      - name: Run tests
        working-directory: server
        env:
          DATABASE_URL: postgres://xensemble:xensemble@127.0.0.1:5432/xensemble
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm test
