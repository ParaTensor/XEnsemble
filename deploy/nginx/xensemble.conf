map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream xensemble_backend {
    server 127.0.0.1:3888;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name xensemble.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xensemble.dev;

    ssl_certificate /etc/nginx/ssl/xensemble.dev.crt;
    ssl_certificate_key /etc/nginx/ssl/xensemble.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://xensemble_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
